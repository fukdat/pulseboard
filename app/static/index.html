<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PulseBoard — Analytics Cockpit</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1117; --panel: #181b24; --line: #262a36;
    --text: #e7e9ee; --muted: #9aa1b1; --accent: #5b8cff; --good: #3ecf8e; --warn: #ffb454; --bad: #ff6b6b;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  header { padding: 28px 32px 8px; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  main { padding: 16px 32px 48px; display: grid; gap: 16px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
  .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
  .card .value { font-size: 26px; font-weight: 650; margin-top: 6px; letter-spacing: -0.02em; }
  .grid2 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
  .panel h2 { margin: 0 0 14px; font-size: 14px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 6px 8px; text-align: center; }
  th { color: var(--muted); font-weight: 500; }
  td.cohort { text-align: left; color: var(--muted); white-space: nowrap; }
  .alert { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .alert:last-child { border-bottom: 0; }
  .pill { font-size: 12px; padding: 2px 9px; border-radius: 999px; }
  .pill.bad { background: rgba(255,107,107,0.15); color: var(--bad); }
  .pill.warn { background: rgba(255,180,84,0.15); color: var(--warn); }
  @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>PulseBoard</h1>
  <p>E-commerce analytics cockpit · live from the metrics API</p>
</header>
<main>
  <section class="cards" id="kpis"></section>

  <section class="grid2">
    <div class="panel">
      <h2>Monthly revenue</h2>
      <canvas id="revenueChart" height="120"></canvas>
    </div>
    <div class="panel">
      <h2>Low-stock alerts</h2>
      <div id="lowStock"></div>
    </div>
  </section>

  <section class="grid2">
    <div class="panel">
      <h2>Cohort retention</h2>
      <div style="overflow-x:auto"><table id="cohorts"></table></div>
    </div>
    <div class="panel">
      <h2>Top products</h2>
      <canvas id="productsChart" height="200"></canvas>
    </div>
  </section>
</main>

<script>
const usd = (cents) => "$" + (cents / 100).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = (x) => (x * 100).toFixed(1) + "%";

async function getJSON(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error(path + " -> " + res.status);
  return res.json();
}

function renderKpis(s) {
  const items = [
    ["Total revenue", usd(s.total_revenue_cents)],
    ["Orders", s.total_orders.toLocaleString()],
    ["Customers", s.unique_customers.toLocaleString()],
    ["Avg order value", usd(s.aov_cents)],
    ["Avg LTV", usd(s.average_ltv_cents)],
    ["Repeat rate", pct(s.repeat_purchase_rate)],
    ["Churn rate", pct(s.churn_rate)],
  ];
  document.getElementById("kpis").innerHTML = items.map(
    ([label, value]) => `<div class="card"><div class="label">${label}</div><div class="value">${value}</div></div>`
  ).join("");
}

function renderRevenue(rows) {
  new Chart(document.getElementById("revenueChart"), {
    type: "line",
    data: {
      labels: rows.map(r => r.period),
      datasets: [{
        data: rows.map(r => r.revenue_cents / 100),
        borderColor: "#5b8cff", backgroundColor: "rgba(91,140,255,0.15)",
        fill: true, tension: 0.3, pointRadius: 3,
      }],
    },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color: "#262a36" }, ticks: { color: "#9aa1b1" } },
        y: { grid: { color: "#262a36" }, ticks: { color: "#9aa1b1", callback: v => "$" + v } },
      },
    },
  });
}

function renderProducts(rows) {
  new Chart(document.getElementById("productsChart"), {
    type: "bar",
    data: {
      labels: rows.map(r => r.sku.replace("SKU-", "")),
      datasets: [{ data: rows.map(r => r.revenue_cents / 100), backgroundColor: "#3ecf8e" }],
    },
    options: {
      indexAxis: "y",
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color: "#262a36" }, ticks: { color: "#9aa1b1", callback: v => "$" + v } },
        y: { grid: { display: false }, ticks: { color: "#9aa1b1" } },
      },
    },
  });
}

function heat(v) {
  // 0 -> dark, 1 -> accent green
  const a = 0.12 + v * 0.6;
  return `background: rgba(62,207,142,${a.toFixed(2)})`;
}

function renderCohorts(rows) {
  const maxLen = Math.max(0, ...rows.map(r => r.retention.length));
  const head = ["<tr><th class='cohort'>Cohort</th><th>Size</th>"]
    .concat(Array.from({ length: maxLen }, (_, i) => `<th>M${i}</th>`)).join("") + "</tr>";
  const body = rows.map(r => {
    const cells = r.retention.map(v => `<td style="${heat(v)}">${(v * 100).toFixed(0)}%</td>`).join("");
    const pad = Array.from({ length: maxLen - r.retention.length }, () => "<td></td>").join("");
    return `<tr><td class="cohort">${r.cohort}</td><td>${r.size}</td>${cells}${pad}</tr>`;
  }).join("");
  document.getElementById("cohorts").innerHTML = head + body;
}

function renderLowStock(rows) {
  if (!rows.length) { document.getElementById("lowStock").innerHTML = "<p style='color:#9aa1b1'>All stock healthy 🎉</p>"; return; }
  document.getElementById("lowStock").innerHTML = rows.map(p => {
    const critical = p.stock_on_hand <= p.reorder_point / 2;
    return `<div class="alert"><span>${p.name}</span>
      <span class="pill ${critical ? "bad" : "warn"}">${p.stock_on_hand} left · reorder @ ${p.reorder_point}</span></div>`;
  }).join("");
}

async function main() {
  try {
    const [s, rev, coh, prod, low] = await Promise.all([
      getJSON("/metrics/summary"),
      getJSON("/metrics/revenue?granularity=month"),
      getJSON("/metrics/cohorts"),
      getJSON("/metrics/top-products?limit=5"),
      getJSON("/alerts/low-stock"),
    ]);
    renderKpis(s); renderRevenue(rev); renderCohorts(coh); renderProducts(prod); renderLowStock(low);
  } catch (e) {
    document.querySelector("main").insertAdjacentHTML("afterbegin",
      `<div class="panel" style="color:#ff6b6b">Failed to load data: ${e.message}</div>`);
  }
}
main();
</script>
</body>
</html>
